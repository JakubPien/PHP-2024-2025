<!DOCTYPE html>
<html lang="pl">
<head>
    <meta charset="UTF-8">
    <title>Tatuaże</title>
    <link rel="stylesheet" href="styl.css">
</head>
<body>
    <header id="naglowek1">
        <img src="logo.png" alt="salon">
    </header>

    <header id="naglowek2">
        <h1>Studio Tatuażu</h1>
    </header>

    <section id="galeria">
        <h2>Galeria</h2>
        <img src="smok.png" alt="smok.png" class="miniatury">
        <img src="koliber.png" alt="koliber.png" class="miniatury">
    </section>

    <aside>
        <h3>Dodaj wzór</h3>

        <label for="wzor">Wzór:</label><br>
        <input type="file" id="wzor" accept="image/png"><br>

        <label for="kolor">Kolor:</label><br>
        <select id="kolor">
            <option>Czarny</option>
            <option>Czerwony</option>
            <option>Zielony</option>
            <option>Niebieski</option>
        </select><br>

        <label for="cena">Cena:</label><br>
        <input type="number" id="cena"><br>

        <button type="button" onclick="dodajWzor()">Dodaj Wzór</button>
    </aside>

    <footer>
        <p>Autor strony:  Jakub Pieniężny 3p</p>
    </footer>

    <script>
        function dodajWzor() {
            const polePliku = document.getElementById("wzor");
            const kolor = document.getElementById("kolor").value;
            const cena = document.getElementById("cena").value;
            const galeria = document.getElementById("galeria");
            const nazwaPliku = polePliku.files.length > 0
                ? polePliku.files[0].name
                : polePliku.value.split("\\").pop();

            alert(`Wzór: ${nazwaPliku}, kolor ${kolor} w cenie ${cena} zł`);

            const obraz = document.createElement("img");
            obraz.src = nazwaPliku;
            obraz.alt = nazwaPliku;
            obraz.className = "miniatury";
            galeria.appendChild(obraz);
        }
    </script>
</body>
</html>
